services:
  policy:
    build:
      context: .
      dockerfile: policy/Dockerfile
    container_name: deepnfv-policy
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  classifier:
    build:
      context: .
      dockerfile: classifier/Dockerfile
    container_name: deepnfv-classifier
    ports: ["8000:8000"]
    environment:
      POLICY_URL: http://policy:8001/decide
    depends_on:
      policy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
